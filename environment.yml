# Conda environment for DRAGonFLy:  conda env create -f environment.yml
# fenics-dolfinx and mpich are only distributed through conda-forge, and gmsh and pythonocc-core (used to prepare
# CAD geometry, examples/DLR-F25) are taken from there so that they share one OpenCASCADE build; everything else
# (including the LSDOlab packages on their `main` branches) is installed by pip from setup.py.
name: dragonfly
channels:
  - conda-forge
dependencies:
  - python=3.12
  - fenics-dolfinx=0.11.0
  - mpich
  - pyvista
  - networkx
  - python-gmsh
  - pythonocc-core
  - pip
  - pip:
      - -e .[test,docs]
