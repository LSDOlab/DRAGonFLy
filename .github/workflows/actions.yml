# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

# Whenever there is a pull request (PR) or push to the "main" branch, the jobs specified below will run.
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Here, we specify the automatic cloud based testing that will be ran on pushes/PRs to "main"
jobs:
  build:

    # The tests run on ubuntu with the Python 3.12 conda environment defined in environment.yml
    # (fenics-dolfinx and mpich are only available through conda-forge).
    # Add other OSes like windows and macOS if needed.
    runs-on: ubuntu-latest

    # Login shell so that the activated conda environment is used by the `run` steps
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4
    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: dragonfly
        miniforge-version: latest
        channels: conda-forge

      # The package and its dependencies are installed by the `pip` section of environment.yml;
      # we then run the package unit-tests.
    - name: Test with pytest
      # test_form_manager re-runs itself under mpirun; threaded BLAS in the conda stack stalls MPI runs
      env:
        OMP_NUM_THREADS: 1
      run: |
        pytest --cov=dragonfly_sim --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
